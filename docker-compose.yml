version: "3.9"

services:
  db:
    image: postgres:15
    container_name: bp_agent_db
    restart: always
    environment:
      POSTGRES_USER: bp_user
      POSTGRES_PASSWORD: bp_password
      POSTGRES_DB: bp_agent_db
    ports:
      - "5432:5432"
    volumes:
      - bp_pgdata:/var/lib/postgresql/data

volumes:
  bp_pgdata: